<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SuccessHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <!--suppress SpellCheckingInspection -->
  <script>
    (function () {
      try {
        const raw = localStorage.getItem('successhub_prefs');
        const prefs = raw ? JSON.parse(raw) : null;
        const dark = prefs && typeof prefs.darkTheme === 'boolean' ? prefs.darkTheme : true;
        const locale = prefs && prefs.locale ? String(prefs.locale) : 'en-US';
        document.documentElement.classList.toggle('app-dark', dark);
        document.documentElement.lang = locale;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute('content', dark ? 'dark' : 'light');
      } catch (err) {
        console.warn('theme bootstrap failed', err);
        document.documentElement.classList.add('app-dark');
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
</head>
<body>
  <!--suppress SpellCheckingInspection -->
  <script>
    (function () {
      try {
        const raw = localStorage.getItem('successhub_prefs');
        const prefs = raw ? JSON.parse(raw) : null;
        const dark = prefs && typeof prefs.darkTheme === 'boolean' ? prefs.darkTheme : true;
        document.body.classList.toggle('app-dark', dark);
      } catch (err) {
        console.warn('theme bootstrap failed', err);
        document.body.classList.add('app-dark');
      }
    })();
  </script>
  <!--suppress HtmlUnknownTag -->
  <app-root></app-root>
</body>
</html>
