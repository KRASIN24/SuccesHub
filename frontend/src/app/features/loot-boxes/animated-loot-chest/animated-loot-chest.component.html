<svg
  class="animated-loot-chest__svg"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  height="200"
  width="200"
  aria-hidden="true"
>
  <g class="animated-loot-chest__group">
    <polygon
      class="animated-loot-chest__bounce animated-loot-chest__bounce--1"
      transform="rotate(45 100 100)"
      stroke-width="1"
      stroke="currentColor"
      fill="none"
      points="70,70 148,50 130,130 50,150"
    />
    <polygon
      class="animated-loot-chest__bounce animated-loot-chest__bounce--2"
      transform="rotate(45 100 100)"
      stroke-width="1"
      stroke="currentColor"
      fill="none"
      points="70,70 148,50 130,130 50,150"
    />
    <polygon
      transform="rotate(45 100 100)"
      stroke-width="2"
      fill="#414750"
      points="70,70 150,50 130,130 50,150"
    />
    <polygon
      stroke-width="2"
      fill="url(#alc-gradient-main)"
      points="100,70 150,100 100,130 50,100"
    />
    <polygon
      class="animated-loot-chest__accent"
      transform="translate(20, 31)"
      stroke-width="2"
      points="80,50 80,75 80,99 40,75"
    />
    <polygon
      transform="translate(20, 31)"
      stroke-width="2"
      fill="url(#alc-gradient-lid-left)"
      points="40,-40 80,-40 80,99 40,75"
    />
    <polygon
      transform="rotate(180 100 100) translate(20, 20)"
      stroke-width="2"
      fill="currentColor"
      points="80,50 80,75 80,99 40,75"
    />
    <polygon
      transform="rotate(0 100 100) translate(60, 20)"
      stroke-width="2"
      fill="url(#alc-gradient-lid-right)"
      points="40,-40 80,-40 80,85 40,110.2"
    />
    <polygon
      class="animated-loot-chest__particle animated-loot-chest__spark animated-loot-chest__spark--warm"
      transform="rotate(45 100 100) translate(80, 95)"
      points="5,0 5,5 0,5 0,0"
    />
    <polygon
      class="animated-loot-chest__particle animated-loot-chest__particle--delay animated-loot-chest__spark animated-loot-chest__spark--mid"
      transform="rotate(45 100 100) translate(80, 55)"
      points="6,0 6,6 0,6 0,0"
    />
    <polygon
      class="animated-loot-chest__particle animated-loot-chest__particle--delay2"
      transform="rotate(45 100 100) translate(70, 80)"
      fill="#fff"
      points="2,0 2,2 0,2 0,0"
    />
    <polygon fill="#292d34" points="29.5,99.8 100,142 100,172 29.5,130" />
    <polygon
      transform="translate(50, 92)"
      fill="#1f2127"
      points="50,50 120.5,8 120.5,35 50,80"
    />
  </g>

  <defs>
    <linearGradient id="alc-gradient-main" y2="100%" x2="10%" y1="0%" x1="0%">
      <stop style="stop-color: #1e2026; stop-opacity: 1" offset="20%" />
      <stop style="stop-color: #414750; stop-opacity: 1" offset="60%" />
    </linearGradient>
    <linearGradient id="alc-gradient-lid-left" y2="100%" x2="0%" y1="-17%" x1="10%">
      <stop style="stop-color: #d3a51000; stop-opacity: 1" offset="20%" />
      <stop class="animated-loot-chest__glow-stop" style="stop-color: #d3a51054; stop-opacity: 1" offset="100%" />
    </linearGradient>
    <linearGradient id="alc-gradient-lid-right" y2="100%" x2="10%" y1="0%" x1="0%">
      <stop style="stop-color: #d3a51000; stop-opacity: 1" offset="20%" />
      <stop class="animated-loot-chest__glow-stop" style="stop-color: #d3a51054; stop-opacity: 1" offset="100%" />
    </linearGradient>
  </defs>
</svg>
