<nav class="sidebar" aria-label="Main navigation">
  <button
    type="button"
    class="sidebar-close"
    (click)="closeRequested.emit()"
    aria-label="Close navigation"
  >
    <span class="material-icons">close</span>
  </button>

  <div class="nav-section nav-section--main">
    @for (item of navItems; track item.route) {
      <a
        class="nav-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [attr.aria-label]="item.labelKey | translate"
      >
        <span class="material-icons nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.labelKey | translate }}</span>
        @if (item.showPendingBadge && lootPending.totalPendingCount() > 0) {
          <app-count-badge
            class="nav-badge"
            [count]="lootPending.totalPendingCount()"
            ariaLabel="Pending caches"
          />
        }
        <span class="nav-marker" aria-hidden="true"></span>
      </a>
    }
  </div>

  <div class="nav-spacer"></div>

  <div class="nav-section nav-section--bottom">
    @for (item of bottomItems; track item.route) {
      <a
        class="nav-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [attr.aria-label]="item.labelKey | translate"
      >
        <span class="material-icons nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.labelKey | translate }}</span>
      </a>
    }
    <button type="button" class="nav-link" (click)="logout()" [attr.aria-label]="'common.signOut' | translate">
      <span class="material-icons nav-icon">logout</span>
      <span class="nav-label">{{ 'common.signOut' | translate }}</span>
    </button>
  </div>
</nav>
