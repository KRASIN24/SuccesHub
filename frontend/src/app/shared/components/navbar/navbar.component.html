<header class="topbar">
  <div class="topbar-left">
    @if (!sidebarOpen()) {
      <button
        type="button"
        class="icon-btn menu-btn"
        (click)="onMenuToggle()"
        aria-label="Open navigation"
      >
        <span class="material-icons">menu</span>
      </button>
    }
    <a class="brand" routerLink="/dashboard">SUCCESSHUB</a>
  </div>

  <div class="topbar-right">
    @if (profileService.profile(); as prof) {
      <div class="stat-chip">
        <span class="stat-key">XP:</span>
        <span class="stat-val gold">{{ prof.currentXp | number }}</span>
      </div>
      <div class="stat-chip rank">
        <span class="stat-key">LVL:</span>
        <span class="stat-val">{{ prof.level }}</span>
      </div>
      <div class="stat-chip">
        <span class="stat-key">STREAK:</span>
        <span class="stat-val">{{ prof.currentStreak }}d</span>
      </div>
    }

    <button type="button" class="icon-btn" aria-label="Notifications">
      <span class="material-icons">notifications_none</span>
    </button>
    <a class="avatar-btn" routerLink="/profile" aria-label="Account">
      <span class="material-icons">person</span>
    </a>
  </div>
</header>
