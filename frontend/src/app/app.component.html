<div class="app-shell" [class.nav-closed]="!sidenavOpen()">
  <app-sidebar [collapsed]="!sidenavOpen()" (closeRequested)="closeSidenav()"></app-sidebar>

  <div class="app-backdrop" (click)="closeSidenav()"></div>

  <div class="app-main">
    <app-navbar [sidebarOpen]="sidenavOpen()" (menuToggled)="toggleSidenav()"></app-navbar>
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<app-xp-tick [trigger]="celebrations.xpTrigger()"></app-xp-tick>
<app-level-up-overlay [trigger]="celebrations.levelUpTrigger()"></app-level-up-overlay>
<app-achievement-slam [trigger]="celebrations.achievementTrigger()"></app-achievement-slam>
