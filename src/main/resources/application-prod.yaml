# Production overrides — activate with: --spring.profiles.active=prod
# Set SUCCESSHUB_* env vars (root README). Defaults below still work for local prod-profile smoke tests.
successhub:
  loot:
    enable-dev-grants: false
  auth:
    # Prefer env in real deploy; these document the expected keys.
    frontend-url: ${SUCCESSHUB_FRONTEND_URL:http://localhost:4200/}
    cors-allowed-origins: "${SUCCESSHUB_CORS_ORIGINS:http://localhost:4200,http://localhost:8080}"
    keycloak-logout-uri: ${SUCCESSHUB_KEYCLOAK_LOGOUT_URI:http://localhost:8080/realms/successhub-realm/protocol/openid-connect/logout}

spring:
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
