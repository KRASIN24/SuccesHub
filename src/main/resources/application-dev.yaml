# Local development defaults (activate explicitly or rely on spring.profiles.default in application.yaml).
succeshub:
  loot:
    enable-dev-grants: true

spring:
  jpa:
    show-sql: true

# Keep Spring Security quiet in local HTTP — TRACE floods the console with every probe
# (e.g. Razer Synapse GET /wyvrn/Synapse) and "Not injecting HSTS … [Is Secure]" lines.
# Temporarily set org.springframework.security: DEBUG when debugging auth.

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
