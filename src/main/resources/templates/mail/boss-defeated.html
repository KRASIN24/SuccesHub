<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} ?: 'Boss defeated'">Boss defeated</title>
</head>
<body style="margin:0;padding:0;background:#0a0a0c;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8e6e3;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0a0a0c;padding:40px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="520" cellspacing="0" cellpadding="0"
                   style="max-width:520px;width:100%;background:#141317;border:1px solid #2b292d;border-radius:16px;overflow:hidden;">
                <tr>
                    <td style="padding:28px 32px 8px;background:linear-gradient(180deg,#1a1814 0%,#141317 100%);">
                        <p style="margin:0;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#f5be42;font-weight:600;">SuccessHub</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 32px 32px;">
                        <p style="margin:0 0 10px;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#9b8f7b;">Campaign</p>
                        <h1 th:text="${title} ?: 'Boss defeated'"
                            style="margin:0 0 16px;font-size:24px;line-height:1.25;font-weight:600;color:#f5f3ef;">Boss defeated</h1>
                        <p th:if="${displayName != null}" style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#d3c5af;">
                            Victory, <span th:text="${displayName}">commander</span>.
                        </p>
                        <p th:text="${body}" style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#d3c5af;">A boss has fallen.</p>
                        <a th:if="${frontendBaseUrl != null and actionUrl != null}"
                           th:href="${frontendBaseUrl + actionUrl}"
                           style="display:inline-block;padding:12px 22px;background:linear-gradient(135deg,#f5be42,#d29f22);color:#402d00;text-decoration:none;border-radius:999px;font-size:14px;font-weight:600;">
                            Open campaigns
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 32px 28px;border-top:1px solid #2b292d;">
                        <p style="margin:20px 0 0;font-size:12px;line-height:1.5;color:#7a746c;">
                            Sent by SuccessHub. You received this because of activity on your account.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
