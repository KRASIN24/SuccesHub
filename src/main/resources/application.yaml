# Auth / deploy URLs — defaults = local Docker + Angular; override via env (see docs/deploy.md).
succeshub:
  auth:
    frontend-url: ${SUCCESSHUB_FRONTEND_URL:http://localhost:4200/}
    cors-allowed-origins: "${SUCCESSHUB_CORS_ORIGINS:http://localhost:4200,http://localhost:8080}"
    keycloak-logout-uri: ${SUCCESSHUB_KEYCLOAK_LOGOUT_URI:http://localhost:8080/realms/succeshub-realm/protocol/openid-connect/logout}
  keycloak:
    server-url: ${SUCCESSHUB_KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${SUCCESSHUB_KEYCLOAK_REALM:succeshub-realm}
    admin-client-id: ${SUCCESSHUB_KEYCLOAK_ADMIN_CLIENT_ID:succeshub-admin}
    admin-client-secret: ${SUCCESSHUB_KEYCLOAK_ADMIN_CLIENT_SECRET:admin-changeme}

spring:
  application:
    name: SuccesHub
  profiles:
    default: dev
  datasource:
    url: ${SUCCESSHUB_DB_URL:jdbc:postgresql://localhost:5432/succeshub}
    username: ${SUCCESSHUB_DB_USER:postgres}
    password: ${SUCCESSHUB_DB_PASSWORD:postgres}
  jackson:
    deserialization:
      accept-empty-string-as-null-object: true
  jpa:
    properties:
      hibernate:
        default_schema: succeshub
    hibernate:
      ddl-auto: validate
  liquibase:
    default-schema: succeshub
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: smtp.mailserver.com
    port: 587
    username: mailuser
    password: mailpass
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${SUCCESSHUB_OAUTH_CLIENT_ID:succeshub-backend}
            client-secret: ${SUCCESSHUB_OAUTH_CLIENT_SECRET:changeme}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "${SUCCESSHUB_OAUTH_REDIRECT_URI:http://localhost:4200/login/oauth2/code/keycloak}"
        provider:
          keycloak:
            authorization-uri: ${SUCCESSHUB_KEYCLOAK_AUTH_URI:http://localhost:8080/realms/succeshub-realm/protocol/openid-connect/auth}
            token-uri: ${SUCCESSHUB_KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/succeshub-realm/protocol/openid-connect/token}
            jwk-set-uri: ${SUCCESSHUB_KEYCLOAK_JWK_URI:http://localhost:8080/realms/succeshub-realm/protocol/openid-connect/certs}
            user-info-uri: ${SUCCESSHUB_KEYCLOAK_USERINFO_URI:http://localhost:8080/realms/succeshub-realm/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

server:
  port: 8082
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

retry:
  max-attempts: 3
  backoff:
    delay: 2000
